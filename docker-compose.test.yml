x-lago-common: &lago-common
  image: getlago/api:v1.42.0
  restart: "no"
  environment:
    DATABASE_URL: postgresql://lago:${POSTGRES_PASSWORD}@db:5432/lago
    REDIS_URL: redis://redis:6379
    SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
    RAILS_ENV: production
    LAGO_RSA_PRIVATE_KEY: "${LAGO_RSA_PRIVATE_KEY}"
    LAGO_ENCRYPTION_PRIMARY_KEY: "${LAGO_ENCRYPTION_PRIMARY_KEY}"
    LAGO_ENCRYPTION_DETERMINISTIC_KEY: "${LAGO_ENCRYPTION_DETERMINISTIC_KEY}"
    LAGO_ENCRYPTION_KEY_DERIVATION_SALT: "${LAGO_ENCRYPTION_KEY_DERIVATION_SALT}"
    LAGO_CREATE_ORG: "true"
    LAGO_ORG_API_KEY: "${LAGO_ORG_API_KEY}"
    LAGO_ORG_NAME: "test"
    LAGO_ORG_USER_EMAIL: "test@test.com"
    LAGO_ORG_USER_PASSWORD: "${LAGO_ORG_USER_PASSWORD}"
    LAGO_DISABLE_SEGMENT: "true"
    LAGO_RAILS_STDOUT: "true"

services:
  db:
    image: getlago/postgres-partman:15.0-alpine
    restart: "no"
    environment:
      POSTGRES_USER: lago
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: lago
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lago"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *lago-common
    command: ["./scripts/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *lago-common
    command: ["./scripts/start.api.sh"]
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  api-worker:
    <<: *lago-common
    command: ["./scripts/start.worker.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api-clock:
    <<: *lago-common
    command: ["./scripts/start.clock.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
