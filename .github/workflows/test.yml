# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # Run unit/plan tests in a matrix with OpenTofu and Terraform CLI versions
  test:
    name: 'Tests: ${{ matrix.cli.name }} ${{ matrix.cli.version }}'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cli:
          - name: OpenTofu
            flavor: opentofu
            version: '1.11.*'
          - name: Terraform
            flavor: terraform
            version: '1.14.*'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install OpenTofu ${{ matrix.cli.version }}
        if: matrix.cli.flavor == 'opentofu'
        uses: opentofu/setup-opentofu@12f4debbf681675350b6cd1f0ff8ecfbda62027b # v1.0.4
        with:
          tofu_version: ${{ matrix.cli.version }}
          tofu_wrapper: false

      - name: Install Terraform ${{ matrix.cli.version }}
        if: matrix.cli.flavor == 'terraform'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ matrix.cli.version }}
          terraform_wrapper: false

      - run: go mod download

      - name: Set TF_ACC_TERRAFORM_PATH (OpenTofu)
        if: matrix.cli.flavor == 'opentofu'
        run: echo "TF_ACC_TERRAFORM_PATH=$(which tofu)" >> "$GITHUB_ENV"

      - name: Set TF_ACC_TERRAFORM_PATH (Terraform)
        if: matrix.cli.flavor == 'terraform'
        run: echo "TF_ACC_TERRAFORM_PATH=$(which terraform)" >> "$GITHUB_ENV"

      - env:
          TF_ACC: "1"
          TF_ACC_PROVIDER_NAMESPACE: "rpcpool"
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10

  # Run acceptance tests against a live Lago instance
  test-acceptance:
    name: 'Lago Acceptance Tests: ${{ matrix.cli.name }} ${{ matrix.cli.version }}'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cli:
          - name: OpenTofu
            flavor: opentofu
            version: '1.11.*'
          - name: Terraform
            flavor: terraform
            version: '1.14.*'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install OpenTofu ${{ matrix.cli.version }}
        if: matrix.cli.flavor == 'opentofu'
        uses: opentofu/setup-opentofu@12f4debbf681675350b6cd1f0ff8ecfbda62027b # v1.0.4
        with:
          tofu_version: ${{ matrix.cli.version }}
          tofu_wrapper: false

      - name: Install Terraform ${{ matrix.cli.version }}
        if: matrix.cli.flavor == 'terraform'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ matrix.cli.version }}
          terraform_wrapper: false

      - run: go mod download

      - name: Set TF_ACC_TERRAFORM_PATH (OpenTofu)
        if: matrix.cli.flavor == 'opentofu'
        run: echo "TF_ACC_TERRAFORM_PATH=$(which tofu)" >> "$GITHUB_ENV"

      - name: Set TF_ACC_TERRAFORM_PATH (Terraform)
        if: matrix.cli.flavor == 'terraform'
        run: echo "TF_ACC_TERRAFORM_PATH=$(which terraform)" >> "$GITHUB_ENV"

      - name: Generate ephemeral test secrets
        run: |
          LAGO_RSA_PRIVATE_KEY=$(openssl genrsa 2048 2>/dev/null | base64 -w0)
          LAGO_ORG_API_KEY="lago-test-$(openssl rand -hex 16)"
          SECRET_KEY_BASE=$(openssl rand -hex 64)
          LAGO_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 16)
          LAGO_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 16)
          LAGO_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 16)
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          LAGO_ORG_USER_PASSWORD=$(openssl rand -hex 12)
          # Mask all secrets in logs
          echo "::add-mask::$LAGO_RSA_PRIVATE_KEY"
          echo "::add-mask::$LAGO_ORG_API_KEY"
          echo "::add-mask::$SECRET_KEY_BASE"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$LAGO_ORG_USER_PASSWORD"
          # Export to subsequent steps via GITHUB_ENV
          echo "LAGO_RSA_PRIVATE_KEY=$LAGO_RSA_PRIVATE_KEY" >> "$GITHUB_ENV"
          echo "LAGO_ORG_API_KEY=$LAGO_ORG_API_KEY" >> "$GITHUB_ENV"
          echo "SECRET_KEY_BASE=$SECRET_KEY_BASE" >> "$GITHUB_ENV"
          echo "LAGO_ENCRYPTION_PRIMARY_KEY=$LAGO_ENCRYPTION_PRIMARY_KEY" >> "$GITHUB_ENV"
          echo "LAGO_ENCRYPTION_DETERMINISTIC_KEY=$LAGO_ENCRYPTION_DETERMINISTIC_KEY" >> "$GITHUB_ENV"
          echo "LAGO_ENCRYPTION_KEY_DERIVATION_SALT=$LAGO_ENCRYPTION_KEY_DERIVATION_SALT" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
          echo "LAGO_ORG_USER_PASSWORD=$LAGO_ORG_USER_PASSWORD" >> "$GITHUB_ENV"

      - name: Start Lago services
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for Lago API to be healthy
        run: |
          echo "Waiting for Lago API to become healthy..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' \
              $(docker compose -f docker-compose.test.yml ps -q api) 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "healthy" ]; then
              echo "Lago API is healthy after ${i} attempts"
              exit 0
            fi
            echo "Attempt $i/30 — status: $STATUS — sleeping 10s..."
            sleep 10
          done
          echo "ERROR: Lago API did not become healthy within 5 minutes"
          docker compose -f docker-compose.test.yml logs
          exit 1

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          LAGO_ACC: "1"
          TF_ACC_PROVIDER_NAMESPACE: "rpcpool"
          LAGO_API_ENDPOINT: "http://localhost:3000"
          LAGO_API_KEY: ${{ env.LAGO_ORG_API_KEY }}
        run: go test -v -cover -timeout 20m ./internal/provider/

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Tear down Lago services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
